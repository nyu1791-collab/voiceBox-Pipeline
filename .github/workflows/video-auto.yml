name: video-auto

# 1日3回、Geminiが公開ニュースから話題を選び、制作ジョブを作る。
# 定期実行は、リポジトリ変数 AUTO_VIDEO_ENABLED が true のときだけ動く（既定は止まっている）。
# 手動実行（workflow_dispatch）はいつでも動く。
# 費用が出る調査・台本、Colab GPU、YouTube アップロードは、次の段階で追加する（docs/VIDEO_JOB_ROUTE.md）。
on:
  schedule:
    - cron: "0 0,8,16 * * *"   # UTC。日本時間 09:00・17:00・01:00
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: video-auto
  cancel-in-progress: false
jobs:
  topic:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.AUTO_VIDEO_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Let Gemini choose today's topic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICEBOX_GEMINI_ROUTE: api_key   # 既定の vertex は、この実行では設定していないため使わない
        run: |
          mkdir -p "$RUNNER_TEMP/jobs"
          python tools/auto_topic.py --jobs "$RUNNER_TEMP/jobs"
      - name: Make the research request (no paid call)
        run: |
          for job in "$RUNNER_TEMP"/jobs/*.json; do
            python tools/video_job.py plan --job "$job" --out "$RUNNER_TEMP/run-$(basename "$job" .json)"
          done
