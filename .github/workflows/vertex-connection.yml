name: Check VOICEBOX Vertex connection
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.VOICEBOX_WIF_PROVIDER || 'projects/793547679344/locations/global/workloadIdentityPools/voicebox-actions/providers/github' }}
          service_account: ${{ vars.VOICEBOX_VERTEX_SERVICE_ACCOUNT || 'voicebox-vertex@project-fdadb4dd-cb77-4270-9cd.iam.gserviceaccount.com' }}
      - name: Check Vertex models with small sample requests
        env:
          VOICEBOX_VERTEX_PROJECT: ${{ vars.VOICEBOX_VERTEX_PROJECT || 'project-fdadb4dd-cb77-4270-9cd' }}
        run: |
          python -m pip install 'google-auth>=2.35,<3' 'requests>=2.31,<3'
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          espeak-ng -w "$RUNNER_TEMP/sample.wav" 'Testing speech recognition.'
          ffmpeg -v error -i "$RUNNER_TEMP/sample.wav" -ar 16000 -ac 1 -b:a 48k "$RUNNER_TEMP/sample.mp3"
          python tools/check_vertex_models.py "$RUNNER_TEMP/sample.mp3"
