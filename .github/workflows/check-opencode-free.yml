name: OpenCode Free Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verified official OpenCode CLI
        run: npm install --global opencode-ai@1.19.0
      - name: Check one free script response
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: python tools/check_opencode.py --allow-api --output "$RUNNER_TEMP/opencode-connection.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencode-connection-${{ github.run_id }}
          path: ${{ runner.temp }}/opencode-connection.json
          if-no-files-found: error
          retention-days: 7
