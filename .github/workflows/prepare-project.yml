name: Research and JSON Project

on:
  workflow_dispatch:
    inputs:
      topic:
        description: '調べるテーマ'
        required: true
        type: string
      source_urls:
        description: '公開記事やYouTube動画のURL（任意・1行1件）'
        type: string
      capture_url:
        description: '指定した場合はYouTubeの撮影だけを実行'
        type: string
      image_query:
        description: '指定した場合は関連画像の取得だけを実行'
        type: string
      resume_run_id:
        description: '以前の調査・画像を再利用する実行ID（任意）'
        type: string
      regenerate_dialogue:
        description: '保存した資料から台本だけを作り直す'
        type: boolean
        default: false
      provider:
        description: '既定はGeminiで調査・撮影・台本作成。noneは情報収集のみ'
        type: choice
        options: [none, gemini]
        default: gemini
      model:
        description: '空欄は gemini-3.8-flash'
        type: string
      minutes:
        description: '台本の目標分数。実尺の保証ではない'
        type: number
        default: 10

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reuse a saved source pack
        if: inputs.resume_run_id != '' && inputs.capture_url == '' && inputs.image_query == ''
        uses: actions/download-artifact@v4
        with:
          name: source-pack-${{ inputs.resume_run_id }}
          path: ${{ runner.temp }}/source-pack
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Connect Vertex for Gemini
        if: inputs.provider == 'gemini' && inputs.capture_url == '' && inputs.image_query == ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.VOICEBOX_WIF_PROVIDER || 'projects/793547679344/locations/global/workloadIdentityPools/voicebox-actions/providers/github' }}
          service_account: ${{ vars.VOICEBOX_VERTEX_SERVICE_ACCOUNT || 'voicebox-vertex@project-fdadb4dd-cb77-4270-9cd.iam.gserviceaccount.com' }}
          create_credentials_file: true
      - uses: actions/cache@v4
        if: inputs.image_query == ''
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.64.0-${{ runner.os }}
      - name: Research and browser tools
        env:
          IMAGE_QUERY: ${{ inputs.image_query }}
          PROVIDER: ${{ inputs.provider }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          python -m pip install 'google-auth>=2.35,<3' 'requests>=2.31,<3'
          NEED_BROWSER=true
          if [ -n "$IMAGE_QUERY" ]; then
            python -m pip install 'Pillow>=10.4,<12' 'ddgs==9.16.0'
            NEED_BROWSER=false
          elif [ -n "$RESUME_RUN_ID" ] && [ -s "$RUNNER_TEMP/source-pack/materials/manifest.json" ] && [ -s "$RUNNER_TEMP/source-pack/materials/related/manifest.json" ]; then
            python -m pip install 'Pillow>=10.4,<12'
            NEED_BROWSER=false
          elif [ "$PROVIDER" = 'gemini' ]; then
            python -m pip install 'Pillow>=10.4,<12' 'playwright==1.64.0' 'ddgs==9.16.0'
          else
            python -m pip install -r requirements.txt
          fi
          if [ "$NEED_BROWSER" = true ]; then
            python -m playwright install --with-deps chromium
          fi
      - name: Collect and prepare
        if: inputs.capture_url == '' && inputs.image_query == ''
        env:
          TOPIC: ${{ inputs.topic }}
          SOURCE_URLS: ${{ inputs.source_urls }}
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          MINUTES: ${{ inputs.minutes }}
          GEMINI_API_KEY: ${{ inputs.provider == 'gemini' && secrets.GEMINI_API_KEY || '' }}
          VOICEBOX_VERTEX_PROJECT: ${{ vars.VOICEBOX_VERTEX_PROJECT || 'project-fdadb4dd-cb77-4270-9cd' }}
          YOUTUBE_STORAGE_STATE: ${{ secrets.YOUTUBE_STORAGE_STATE }}
          REGENERATE_DIALOGUE: ${{ inputs.regenerate_dialogue }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from tools.prepare_project import prepare
          request = {'topic': os.environ['TOPIC'], 'provider': os.environ['PROVIDER'],
                     'model': os.environ['MODEL'], 'minutes': float(os.environ['MINUTES']),
                     'urls': os.environ.get('SOURCE_URLS', '').splitlines()}
          output = Path(os.environ['RUNNER_TEMP'])/'source-pack'
          result = prepare(request, output,
                           allow_api=request['provider'] != 'none',
                           regenerate_dialogue=os.environ.get('REGENERATE_DIALOGUE') == 'true')
          print(json.dumps(result, ensure_ascii=False))
          PY
      - name: Capture YouTube
        if: inputs.capture_url != '' && inputs.image_query == ''
        env:
          VIDEO_URL: ${{ inputs.capture_url }}
          YOUTUBE_STORAGE_STATE: ${{ secrets.YOUTUBE_STORAGE_STATE }}
        run: |
          python - <<'PY'
          import asyncio, json, os
          from pathlib import Path
          from gemini_workflow import youtube_video
          from renderer.material_capture import capture_targets
          url = os.environ['VIDEO_URL']
          if not youtube_video(url):
              raise ValueError('公開YouTube動画のURLを指定してください')
          result = asyncio.run(capture_targets([{'id': 'youtube', 'url': url, 'viewport_only': True,
              'article_region': True, 'region_selector': '#movie_player'}],
              Path(os.environ['RUNNER_TEMP'])/'source-pack', retry_delays=()))
          print(json.dumps(result, ensure_ascii=False))
          PY
      - name: Collect related images
        if: inputs.image_query != ''
        env:
          IMAGE_QUERY: ${{ inputs.image_query }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from image_search import collect_related_images
          from pipeline import atomic_json
          root = Path(os.environ['RUNNER_TEMP'])/'source-pack'
          result = collect_related_images(os.environ['IMAGE_QUERY'], root/'materials/related')
          atomic_json(root/'materials/related/manifest.json', result)
          print(json.dumps({'images': len(result['images']), 'errors': result['errors']}, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-pack-${{ github.run_id }}
          path: ${{ runner.temp }}/source-pack/
          if-no-files-found: warn
          retention-days: 7
