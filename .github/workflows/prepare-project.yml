name: Research and JSON Project

on:
  workflow_dispatch:
    inputs:
      topic:
        description: '調べるテーマ'
        required: true
        type: string
      source_urls:
        description: '公開記事やYouTube動画のURL（任意・1行1件）'
        type: string
      provider:
        description: '既定はGeminiで調査・撮影・台本作成。noneは情報収集のみ'
        type: choice
        options: [none, gemini, groq, opencode]
        default: gemini
      model:
        description: '空欄のGeminiは gemini-3.8-flash。OpenCodeは deepseek-v4.1-flash-free'
        type: string
      minutes:
        description: '台本の目標分数。実尺の保証ではない'
        type: number
        default: 10

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        if: inputs.provider == 'opencode'
        with:
          node-version: '22'
      - name: Install verified official OpenCode CLI
        if: inputs.provider == 'opencode'
        run: npm install --global opencode-ai@1.19.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.64.0-${{ runner.os }}
      - name: Research and browser tools
        run: |
          if [ '${{ inputs.provider }}' = 'gemini' ]; then
            python -m pip install 'Pillow>=10.4,<12' 'playwright==1.64.0'
          else
            python -m pip install -r requirements.txt
          fi
          python -m playwright install --with-deps chromium
      - name: Collect and prepare
        env:
          TOPIC: ${{ inputs.topic }}
          SOURCE_URLS: ${{ inputs.source_urls }}
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          MINUTES: ${{ inputs.minutes }}
          GEMINI_API_KEY: ${{ inputs.provider == 'gemini' && secrets.GEMINI_API_KEY || '' }}
          GROQ_API_KEY: ${{ inputs.provider == 'groq' && secrets.GROQ_API_KEY || '' }}
          OPENCODE_API_KEY: ${{ inputs.provider == 'opencode' && secrets.OPENCODE_API_KEY || '' }}
          YOUTUBE_STORAGE_STATE: ${{ secrets.YOUTUBE_STORAGE_STATE }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from tools.prepare_project import prepare
          request = {'topic': os.environ['TOPIC'], 'provider': os.environ['PROVIDER'],
                     'model': os.environ['MODEL'], 'minutes': float(os.environ['MINUTES']),
                     'urls': os.environ.get('SOURCE_URLS', '').splitlines()}
          result = prepare(request, Path(os.environ['RUNNER_TEMP'])/'source-pack',
                           allow_api=request['provider'] != 'none')
          print(json.dumps(result, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-pack-${{ github.run_id }}
          path: ${{ runner.temp }}/source-pack/
          if-no-files-found: warn
          retention-days: 7
