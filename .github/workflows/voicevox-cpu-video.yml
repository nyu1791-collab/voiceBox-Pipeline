name: VOICEVOX CPU10 Video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'demo: CPU10と編集機能を実行 / production: 提供ZIPから本番描画'
        type: choice
        options: [demo, production]
        default: demo
        required: true
      project_zip_url:
        description: '制作入力ZIPのHTTPS URL。非公開URLはPROJECT_ZIP_URL Secretを使用'
        type: string
        required: false
      resume_run_id:
        description: '前回の動画実行ID。成功した文字起こし区間を再利用（任意）'
        type: string
        required: false
      allow_script_api:
        description: 'Gemini以外の台本APIを許可。Geminiはrequestで指定するだけ'
        type: boolean
        default: false
      script_provider:
        description: 'OpenCode無料版はopencodeを明示選択。既存Gemini/Groqはrequest'
        type: choice
        options: [request, opencode]
        default: request

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: voicebox-cpu-video
  cancel-in-progress: false

jobs:
  make-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VOICEVOX_DIR: /home/runner/.cache/voicebox-tools/voicevox-0.25.2
      CUDA_VISIBLE_DEVICES: '-1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      IMAGEIO_FFMPEG_EXE: /usr/bin/ffmpeg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Connect Vertex for Gemini and Transcribe
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.VOICEBOX_WIF_PROVIDER || 'projects/793547679344/locations/global/workloadIdentityPools/voicebox-actions/providers/github' }}
          service_account: ${{ vars.VOICEBOX_VERTEX_SERVICE_ACCOUNT || 'voicebox-vertex@project-fdadb4dd-cb77-4270-9cd.iam.gserviceaccount.com' }}
          create_credentials_file: true
      - uses: actions/setup-node@v4
        if: inputs.mode == 'production' && inputs.allow_script_api && inputs.script_provider == 'opencode'
        with:
          node-version: '22'
      - name: Install verified official OpenCode CLI
        if: inputs.mode == 'production' && inputs.allow_script_api && inputs.script_provider == 'opencode'
        run: npm install --global opencode-ai@1.19.0
      - name: CPU tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg p7zip-full libcairo2 fontconfig
          python -m pip install -r requirements.txt
      - name: Browser for optional research input
        if: inputs.mode == 'production'
        run: python -m playwright install --with-deps chromium
      - name: Restore official engine cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/voicebox-tools
          key: voicevox-linux-cpu-x64-0.25.2-bab016a966131b89-v1
      - name: Install official VOICEVOX CPU
        run: python tools/install_voicevox.py --directory "$VOICEVOX_DIR"
      - name: Restore previous transcription
        if: inputs.resume_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: voicebox-video-${{ inputs.resume_run_id }}
          path: ${{ runner.temp }}/previous-voicebox
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Reuse transcription chunks
        if: inputs.resume_run_id != ''
        run: |
          mkdir -p "$RUNNER_TEMP/voicebox-output"
          if [ -d "$RUNNER_TEMP/previous-voicebox/transcription-cache" ]; then
            cp -a "$RUNNER_TEMP/previous-voicebox/transcription-cache" "$RUNNER_TEMP/voicebox-output/"
          fi
      - name: Generate speech and MP4
        env:
          RUN_MODE: ${{ inputs.mode || 'demo' }}
          PROJECT_ZIP_URL: ${{ inputs.project_zip_url || secrets.PROJECT_ZIP_URL }}
          ALLOW_SCRIPT_API: ${{ inputs.allow_script_api || 'false' }}
          SCRIPT_PROVIDER: ${{ inputs.script_provider || 'request' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICEBOX_VERTEX_PROJECT: ${{ vars.VOICEBOX_VERTEX_PROJECT || 'project-fdadb4dd-cb77-4270-9cd' }}
          GROQ_API_KEY: ${{ inputs.script_provider != 'opencode' && secrets.GROQ_API_KEY || '' }}
          OPENCODE_API_KEY: ${{ inputs.mode == 'production' && inputs.allow_script_api && inputs.script_provider == 'opencode' && secrets.OPENCODE_API_KEY || '' }}
          YOUTUBE_STORAGE_STATE: ${{ secrets.YOUTUBE_STORAGE_STATE }}
        run: python tools/actions_run.py --mode "$RUN_MODE" --engine-dir "$VOICEVOX_DIR" --output "$RUNNER_TEMP/voicebox-output"
      - name: Store collected sources, screenshots and dialogue
        if: always() && inputs.mode == 'production'
        uses: actions/upload-artifact@v4
        with:
          name: voicebox-source-pack-${{ github.run_id }}
          path: ${{ runner.temp }}/voicebox-output/source-pack/
          if-no-files-found: ignore
          retention-days: 7
      - name: Store completed MP4 and technical result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voicebox-video-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/voicebox-output/video.mp4
            ${{ runner.temp }}/voicebox-output/metrics.json
            ${{ runner.temp }}/voicebox-output/cpu-voice-receipt.json
            ${{ runner.temp }}/voicebox-output/thumbnail.png
            ${{ runner.temp }}/voicebox-output/sound-effects.json
            ${{ runner.temp }}/voicebox-output/description.txt
            ${{ runner.temp }}/voicebox-output/subtitles.srt
            ${{ runner.temp }}/voicebox-output/subtitles.ass
            ${{ runner.temp }}/voicebox-output/subtitles.vtt
            ${{ runner.temp }}/voicebox-output/subtitles.json
            ${{ runner.temp }}/voicebox-output/transcription.json
            ${{ runner.temp }}/voicebox-output/transcription-cache/
            ${{ runner.temp }}/voicebox-output/timing.json
            ${{ runner.temp }}/voicebox-output/state.json
          if-no-files-found: warn
          retention-days: 7
