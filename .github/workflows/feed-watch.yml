name: feed-watch

# 1時間ごとに config/feeds.json のRSS・RSSHub経路・Xの公開プロフィールを見て、新着をGeminiに読ませ、動画にする話題があれば制作ジョブを作る。
# X はログインせずに読み、FreshRSS X Profiles 拡張（MIT、下の X_PARSER_COMMIT で固定）の解析を使う。
# 定期実行は、リポジトリ変数 FEED_WATCH_ENABLED が true のときだけ動く（既定は止まっている）。手動実行はいつでも動く。
# 既読の記録は Actions のキャッシュ（feed-state-*）に保存する。1日に作るジョブは FEED_DAILY_MAX（既定3）まで。
# ジョブの後の工程は video-auto.yml と同じ（調査依頼まで。音声と書き出しは Colab GPU の段階で追加する。docs/VIDEO_JOB_ROUTE.md）。
on:
  schedule:
    - cron: "23 * * * *"   # 毎時23分（UTC・JSTとも同じ分）
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: video-auto   # video-auto.yml と同時に話題を選ばない
  cancel-in-progress: false
env:
  RSSHUB_VERSION: 1.0.0-master.6a75df8
  X_PARSER_COMMIT: b7cf9a0d0af233fb88cd2f3f99df8f8b6ee6b312   # shcheglovnd/FreshRSS-xExtension-XProfiles 0.1.4
jobs:
  watch:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.FEED_WATCH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore the read-items record
        uses: actions/cache/restore@v4
        with:
          path: feed-state.json
          key: feed-state-${{ github.run_id }}
          restore-keys: feed-state-
      - name: Cache RSSHub
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rsshub/node_modules
          key: rsshub-${{ env.RSSHUB_VERSION }}
      - name: Install RSSHub (only when config/feeds.json uses it)
        run: |
          if grep -q '"type": "rsshub"' config/feeds.json && [ ! -d "$RUNNER_TEMP/rsshub/node_modules/rsshub" ]; then
            mkdir -p "$RUNNER_TEMP/rsshub"
            cd "$RUNNER_TEMP/rsshub"
            echo '{"private":true,"type":"module"}' > package.json
            npm install --no-audit --no-fund --save-exact "rsshub@$RSSHUB_VERSION"
          fi
      - name: Get the X profile parser (only when config/feeds.json uses X)
        run: |
          if grep -q '"type": "x"' config/feeds.json; then
            git clone --quiet --filter=blob:none https://github.com/shcheglovnd/FreshRSS-xExtension-XProfiles.git "$RUNNER_TEMP/x-parser"
            git -C "$RUNNER_TEMP/x-parser" checkout --quiet "$X_PARSER_COMMIT"
            php -r 'exit(function_exists("mb_substr") ? 0 : 1);'
          fi
      - name: Check the feeds
        id: feeds
        env:
          RSSHUB_DIR: ${{ runner.temp }}/rsshub
          X_PARSER_DIR: ${{ runner.temp }}/x-parser
        run: python tools/feed_watch.py --state feed-state.json --out "$RUNNER_TEMP/new-items.json"
      - name: Let Gemini read the new items and choose a topic
        if: steps.feeds.outputs.new_count != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICEBOX_GEMINI_ROUTE: api_key   # 既定の vertex は、この実行では設定していないため使わない
        run: |
          mkdir -p "$RUNNER_TEMP/jobs"
          python tools/auto_topic.py --jobs "$RUNNER_TEMP/jobs" --candidates "$RUNNER_TEMP/new-items.json" \
            --state feed-state.json --daily-max "${{ vars.FEED_DAILY_MAX || 3 }}"
      - name: Make the research request (no paid call)
        if: steps.feeds.outputs.new_count != '0'
        run: |
          for job in "$RUNNER_TEMP"/jobs/*.json; do
            [ -e "$job" ] || continue
            python tools/video_job.py plan --job "$job" --out "$RUNNER_TEMP/run-$(basename "$job" .json)"
          done
      - name: Save the read-items record
        if: always()
        uses: actions/cache/save@v4
        with:
          path: feed-state.json
          key: feed-state-${{ github.run_id }}
