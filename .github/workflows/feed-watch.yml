name: feed-watch

# 8時間ごとに config/feeds.json の約100の情報源（公式サイト・報道・ネットの話題・著名人の公式チャンネル）を見て、
# 新着からGeminiがトレンドを分析し、人気が出そうな話題があれば制作ジョブを作る。分析結果は実行の Summary と Artifact に残す。
# 定期実行は、リポジトリ変数 FEED_WATCH_ENABLED が true のときだけ動く（既定は止まっている）。手動実行はいつでも動く。
# 既読の記録は Actions のキャッシュ（feed-state-*）に保存する。1日に作るジョブは FEED_DAILY_MAX（既定3）まで。
# ジョブの後の工程は video-auto.yml と同じ（調査依頼まで。音声と書き出しは Colab GPU の段階で追加する。docs/VIDEO_JOB_ROUTE.md）。
on:
  schedule:
    - cron: "23 23,7,15 * * *"   # UTC。日本時間 08:23・16:23・00:23
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: video-auto   # video-auto.yml と同時に話題を選ばない
  cancel-in-progress: false
env:
  RSSHUB_VERSION: 1.0.0-master.6a75df8
jobs:
  watch:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.FEED_WATCH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore the read-items record
        uses: actions/cache/restore@v4
        with:
          path: feed-state.json
          key: feed-state-${{ github.run_id }}
          restore-keys: feed-state-
      - name: Cache RSSHub
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rsshub/node_modules
          key: rsshub-${{ env.RSSHUB_VERSION }}
      - name: Install RSSHub (only when config/feeds.json uses it)
        run: |
          if grep -q '"type": "rsshub"' config/feeds.json && [ ! -d "$RUNNER_TEMP/rsshub/node_modules/rsshub" ]; then
            mkdir -p "$RUNNER_TEMP/rsshub"
            cd "$RUNNER_TEMP/rsshub"
            echo '{"private":true,"type":"module"}' > package.json
            npm install --no-audit --no-fund --save-exact "rsshub@$RSSHUB_VERSION"
          fi
      - name: Check the feeds
        id: feeds
        env:
          RSSHUB_DIR: ${{ runner.temp }}/rsshub
        run: |
          mkdir -p "$RUNNER_TEMP/out/jobs"
          python tools/feed_watch.py --state feed-state.json --out "$RUNNER_TEMP/out/new-items.json"
      - name: Install the verified OpenCode CLI (free model judge)
        if: steps.feeds.outputs.new_count != '0'
        run: npm install --global opencode-ai@1.19.0
      - name: Let OpenCode (free model) analyze the trends and choose a topic
        if: steps.feeds.outputs.new_count != '0'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          python tools/auto_topic.py --jobs "$RUNNER_TEMP/out/jobs" --candidates "$RUNNER_TEMP/out/new-items.json" \
            --state feed-state.json --daily-max "${{ vars.FEED_DAILY_MAX || 3 }}" --report "$RUNNER_TEMP/out/trends.json" \
            --judge opencode
      - name: Make the research request (no paid call)
        if: steps.feeds.outputs.new_count != '0'
        run: |
          for job in "$RUNNER_TEMP"/out/jobs/*.json; do
            [ -e "$job" ] || continue
            python tools/video_job.py plan --job "$job" --out "$RUNNER_TEMP/out/run-$(basename "$job" .json)"
          done
      - name: Download the images and videos of the chosen sources (kept in the runner only)
        if: steps.feeds.outputs.new_count != '0'
        run: |
          for job in "$RUNNER_TEMP"/out/jobs/*.json; do
            [ -e "$job" ] || continue
            id=$(basename "$job" .json)
            python tools/feed_media.py fetch --job "$job" --items "$RUNNER_TEMP/out/new-items.json" --out "$RUNNER_TEMP/media/$id"
          done
      - name: Keep the trend report, new items and jobs (14 days; media is never uploaded)
        if: always() && steps.feeds.outputs.new_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: feed-watch-${{ github.run_id }}
          path: ${{ runner.temp }}/out
          retention-days: 14
          if-no-files-found: ignore
      - name: Discard the downloaded media (the runner is deleted after this run anyway)
        if: always()
        run: |
          for dir in "$RUNNER_TEMP"/media/*/; do
            [ -d "$dir" ] || continue
            python tools/feed_media.py discard --out "${dir%/}"
          done
          rm -rf "$RUNNER_TEMP/media"
      - name: Save the read-items record
        if: always()
        uses: actions/cache/save@v4
        with:
          path: feed-state.json
          key: feed-state-${{ github.run_id }}
